name: Build FULL Mobile Access APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build FULL APK - Universal
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/PrivateAgent-FULL-universal.apk

      - name: Build FULL APK - Split ABIs
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/PrivateAgent-FULL-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/PrivateAgent-FULL-armv7.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/PrivateAgent-FULL-x86_64.apk
          cd dist && sha256sum *.apk > SHA256SUMS.txt && ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: PrivateAgent-FULL-APK
          path: dist/*
